# PR과 main 푸시마다 백엔드(pytest)와 프론트엔드(npm test, build)를 검사한다.
# 아직 코드가 없는 영역은 건너뛰고 통과로 표시한다. 해당 파일이 생기면 자동으로 검사가 시작된다.
# 브랜치 보호의 필수 검사(Required status checks)에는 "backend", "frontend" 두 잡을 등록한다.
name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# 같은 PR에 새 커밋이 올라오면 이전 실행을 취소한다.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 테스트는 외부 API·실제 키 없이 모의 응답으로 실행한다. 비밀 값을 넣지 않는다.
    env:
      APP_MODE: local
      STORAGE_BACKEND: sqlite
      SQLITE_PATH: .data/ci.db
    steps:
      - uses: actions/checkout@v6

      - name: 백엔드 코드 확인
        id: check
        run: |
          if [ -f pyproject.toml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::pyproject.toml이 없어 백엔드 검사를 건너뜁니다."
          fi

      - name: uv 설치
        if: steps.check.outputs.exists == 'true'
        uses: astral-sh/setup-uv@v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python 3.12 설치
        if: steps.check.outputs.exists == 'true'
        run: uv python install 3.12

      - name: 의존성 설치 (uv.lock 기준)
        if: steps.check.outputs.exists == 'true'
        # uv.lock이 pyproject.toml과 맞지 않으면 실패한다. 로컬에서 uv lock 후 함께 커밋한다.
        run: uv sync --locked

      - name: pytest
        if: steps.check.outputs.exists == 'true'
        run: |
          set +e
          uv run pytest backend/tests -q
          code=$?
          if [ "$code" -eq 5 ]; then
            echo "::warning::수집된 테스트가 없습니다. backend/tests/에 테스트를 추가하세요."
            exit 0
          fi
          exit "$code"

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - name: 프론트엔드 코드 확인
        id: check
        working-directory: .
        run: |
          if [ -f frontend/package.json ] && [ -f frontend/package-lock.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          elif [ -f frontend/package.json ]; then
            echo "::error::frontend/package-lock.json이 없습니다. 로컬에서 npm install 후 잠금 파일을 커밋하세요."
            exit 1
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json이 없어 프론트엔드 검사를 건너뜁니다."
          fi

      - name: Node.js 설치
        if: steps.check.outputs.exists == 'true'
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 의존성 설치
        if: steps.check.outputs.exists == 'true'
        run: npm ci

      - name: npm test
        if: steps.check.outputs.exists == 'true'
        # package.json에 test 스크립트가 없으면 건너뛴다.
        run: npm run test --if-present

      - name: npm run build
        if: steps.check.outputs.exists == 'true'
        # 공개 변수만 사용한다. 카카오 키 등 실제 값은 넣지 않는다.
        env:
          VITE_API_BASE_URL: /api/v1
        run: npm run build

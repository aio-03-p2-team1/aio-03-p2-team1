[project]
name = "dasimanna"
version = "0.1.0"
description = "다시 만나 — LangGraph 기반 구조동물 검색 서비스 (AIO 3기 단위 프로젝트 2, 1팀)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic-settings>=2.16",
    "httpx>=0.28",
    "redis>=8.1",
    "pwdlib[argon2]>=0.3",
    "email-validator>=2.3",
    "langgraph>=1.2",
    "langchain-openai>=1.1",
    "pillow>=13.0.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "fakeredis>=2.40",
    "respx>=0.23",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
